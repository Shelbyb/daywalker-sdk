name: Release

# When a PR is merged into main, tags the merge commit with the version in package.json
# and starts Publish, which pushes that version to npm as `latest`.
#
# The version comes from package.json, so a PR that should release must bump it (the
# `release: vX.Y.Z` commits). If the tag already exists, nothing happens, so merges that
# don't bump the version are skipped rather than failing.
#
# Publish is started with `gh workflow run` because tags pushed with GITHUB_TOKEN don't
# trigger other workflows. npm trusted publishing is bound to publish.yml, so publishing
# stays there and this workflow never touches npm.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
      actions: write # dispatch publish.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Tag the version in package.json
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "release: $tag"
          git push origin "refs/tags/$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Publish also fires on the tag push when it comes from a person; this covers the
      # token-pushed tag. It checks the version against package.json and that it's on main.
      - name: Publish to npm
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: gh workflow run publish.yml --ref main -f version="$VERSION"
