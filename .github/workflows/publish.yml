name: Publish

# Publishes @shelbyb/daywalker-sdk to npm when a tag like v0.1.1 is pushed,
# or when run manually from main with the version to release. Either way the
# version must match package.json, so a run can only publish what's committed.
#
# Auth: npm trusted publishing (OIDC) for this repo and workflow, so no npm token is stored.
# Each release gets a signed provenance attestation linking it to this commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must equal package.json, e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Builds, tests and packs without the OIDC token: dependency code (tsc, tsx…) never runs
  # where it could publish. The publish job only uploads the tarball this job produced.
  build:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Check the release matches package version
        env:
          # Passed through env, never interpolated into the script (no injection).
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Manual publishes must run from main (got $GITHUB_REF)"
              exit 1
            fi
            if [ "$INPUT_VERSION" != "$version" ]; then
              echo "::error::Requested version $INPUT_VERSION does not match package version $version"
              exit 1
            fi
          elif [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version $version"
            exit 1
          fi

      - name: Check the tagged commit is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} ($GITHUB_SHA) is not on main"
            exit 1
          fi

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Pack
        id: pack
        run: echo "tarball=$(npm pack --silent | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+; pinned so a compromised npm@latest can't run here.
      - run: npm install -g npm@11.6.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Provenance still links the release to this repository, workflow and commit.
      - env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./$TARBALL" --access public --provenance
