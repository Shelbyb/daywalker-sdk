name: Publish

# Publishes @shelbyb/daywalker-sdk to npm when a tag like v0.1.1 is pushed,
# or when run manually from main with the version to release. Either way the
# version must match package.json, so a run can only publish what's committed.
#
# Auth: npm trusted publishing (OIDC) for this repo and workflow, so no npm token is stored.
# Each release gets a signed provenance attestation linking it to this commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must equal package.json, e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Actions stay on version tags: their commit SHAs could not be resolved offline when this was written.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Check the release matches package version
        env:
          # Passed through env, never interpolated into the script (no injection).
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Manual publishes must run from main (got $GITHUB_REF)"
              exit 1
            fi
            if [ "$INPUT_VERSION" != "$version" ]; then
              echo "::error::Requested version $INPUT_VERSION does not match package version $version"
              exit 1
            fi
          elif [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version $version"
            exit 1
          fi

      - name: Check the tagged commit is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} ($GITHUB_SHA) is not on main"
            exit 1
          fi

      # Trusted publishing needs npm 11.5.1+; pinned so a compromised npm@latest can't run here.
      - run: npm install -g npm@11.6.2
      # No dependency install scripts run with the OIDC token available; build and test explicitly.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm publish --access public --provenance
